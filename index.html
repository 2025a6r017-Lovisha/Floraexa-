<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floraexa - Plant Identifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f7ed;
            color: #23452d;
        }

        header {
            background: #245b38;
            color: white;
            padding: 22px 8%;
            font-size: 25px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 55px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #58705c;
            font-size: 17px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: 25px auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #23452d15;
        }

        .upload-box {
            border: 2px dashed #8eb99a;
            border-radius: 14px;
            padding: 30px 15px;
            text-align: center;
            background: #f7fbf5;
        }

        input {
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #287747;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #195c32;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #58705c;
        }

        @media (max-width: 650px) {
            .hero h1 {
                font-size: 32px;
            }

            .card {
                margin: 15px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header>🌿 Floraexa</header>

    <section class="hero">
        <h1>Discover the World of Plants</h1>
        <p>Identify plant species and explore leaf health with AI.</p>
    </section>

    <div class="card">
        <h2>🌱 Plant Identifier</h2>
        <p>Upload a clear photo of a plant leaf to get started.</p>

        <div class="upload-box">
            <h3>📷 Upload Your Leaf Image</h3>
            <p>Choose an image from your device</p>
            <input type="file" accept="image/*" id="leafImage">
        </div>

        <button onclick="checkImage()">Identify Plant</button>
        <p id="message"></p>
    </div>

    <footer>Floraexa © 2026 | Plant Discovery & Leaf Health</footer>

    <script>
        function checkImage() {
            const image = document.getElementById("leafImage");
            const message = document.getElementById("message");

            if (image.files.length === 0) {
                message.textContent = "Please upload a leaf image first.";
                return;
            }

            message.textContent =
                "Image selected! AI identification will be connected next.";
        }
    </script>

</body>
</html>
